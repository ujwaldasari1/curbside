[project]
name = "curbside"
version = "0.1.0"
description = "An AI-native, metadata-driven data platform for NYC sanitation data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dlt[postgres]>=1.30,<2",
    "dbt-core>=1.12,<1.13",
    "dbt-postgres>=1.11,<1.12",
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "dagster-dbt>=0.29,<0.30",
    "dagster-dlt>=0.29,<0.30",
    "psycopg[binary]>=3.3",
    "requests>=2.32",
    "mcp>=2.2,<3",
    "sqlglot>=28,<29",
    "dbt-metricflow[dbt-postgres]>=0.15,<0.16",
    "claude-agent-sdk>=0.2.160,<0.3",
    "streamlit>=1.64,<2",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "anyio[trio]>=4",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# dlt.sources.incremental(...) as a default argument is how dlt declares incremental cursors.
"ingestion/sources/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests", "mcp_servers"]
