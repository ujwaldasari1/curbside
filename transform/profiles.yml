curbside:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('CURBSIDE_PG_HOST', 'localhost') }}"
      port: "{{ env_var('CURBSIDE_PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('CURBSIDE_ETL_USER', 'curbside_etl') }}"
      password: "{{ env_var('CURBSIDE_ETL_PASSWORD', 'curbside_etl') }}"
      dbname: "{{ env_var('CURBSIDE_PG_DB', 'curbside') }}"
      schema: staging
      # Single-threaded by default: parallel view rebuilds (dbt's rename/drop-cascade
      # swap) intermittently deadlock in Postgres. The project builds in seconds anyway.
      threads: "{{ env_var('DBT_THREADS', '1') | as_number }}"
