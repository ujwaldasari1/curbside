sources:
  - name: nyc311
    description: >
      NYC 311 service requests routed to the Department of Sanitation (agency = 'DSNY'),
      loaded incrementally by dlt from NYC Open Data dataset erm2-nwe9 on the Socrata
      system field `:updated_at` and merged on unique_key.
    schema: raw_nyc311
    config:
      loaded_at_field: source_updated_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: service_requests
        description: One row per DSNY 311 request (latest version), values as delivered.
