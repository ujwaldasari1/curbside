# Curbside overrides layered on the vendored, unmodified OpenMetadata 2.0.2 compose file
# (infra/openmetadata/docker-compose.yml). Upgrading OpenMetadata = replace that file.
#
# What changes vs. the official stack:
#   - The Airflow-based `ingestion` container is moved behind a profile and never started.
#     Metadata ingestion runs through the `metadata` CLI, triggered by Dagster (saves ~2 GB RAM).
#   - The OpenMetadata Postgres instance also hosts the `curbside` warehouse database.
#   - Ports are published on 127.0.0.1 only. Upstream binds 0.0.0.0, which on shared Wi-Fi
#     exposes Postgres (superuser postgres/password) and Elasticsearch (no auth).
#     `!override` replaces the upstream list; plain `ports:` would be merged with it.
services:
  ingestion:
    profiles: ["airflow"]

  postgresql:
    ports: !override
      - "127.0.0.1:5432:5432"
    volumes:
      # Mount the directory, not single files: editors replace files (new inode), which
      # silently detaches single-file bind mounts.
      - ./postgres:/curbside:ro

  elasticsearch:
    ports: !override
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"

  openmetadata-server:
    ports: !override
      - "127.0.0.1:8585:8585"
      - "127.0.0.1:8586:8586"
